name: travelecho
description: "Making travel experience beautiful."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.0.3
  cupertino_icons: ^1.0.2
  pinput: ^5.0.0
  carousel_slider: ^5.0.0
  permission_handler: ^12.0.0+1
  font_awesome_flutter: ^10.8.0
  flutter_feather_icons: ^2.0.0+1
  eva_icons_flutter: ^3.1.0
  heroicons: ^0.11.0
  line_icons: ^2.0.3
  date_picker_plus: ^4.1.0
  wheel_picker: ^0.2.1
  provider: ^6.1.2
  camera: ^0.10.5
  path_provider: ^2.0.10
  image_picker: ^1.0.7
  image_cropper: ^9.1.0
  gal: ^2.1.0
  dio: ^5.7.0
  http: ^1.1.0
  dartz: ^0.10.1
  flutter_bloc: ^9.0.0
  get_it: ^8.0.3
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  logger: ^2.5.0
  shared_preferences: ^2.3.0
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  internet_connection_checker: ^3.0.1
  timeago: ^3.7.1
  photo_view: ^0.15.0
  shimmer: ^3.0.0
  readmore: ^3.0.0
  dropdown_search: ^6.0.2
  fl_chart: ^1.0.0
  syncfusion_flutter_charts: ^29.2.10
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializer: ^0.2.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/travel_echo_logo.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/json/occupations.json
    - assets/json/interests.json
    - assets/json/language-list-json.json
    - assets/json/countries.json
    - assets/json/currencies.json
    - assets/json/car-models.json
    - assets/images/
    - assets/images/auth/
    - assets/images/home_images/
    - assets/images/currency_converter/
    - assets/images/budget/
    - assets/images/milestones/
    - assets/images/trip_images/
    - assets/images/memories/
    - assets/images/milestones/memory/
    - assets/images/culture_guide/
    - assets/images/profile/
    - assets/images/onboarding/
    - assets/images/community/
    - assets/images/auth/welcome_gif.gif

  fonts:
    - family: vaio_con_dios
      fonts:
        - asset: assets/fonts/vaio_con_dios/_IO CON DIOS.otf
    - family: segoe_ui
      fonts:
        - asset: assets/fonts/segoe-ui-this/segoeuithibd.ttf
          weight: 700
        - asset: assets/fonts/segoe-ui-this/segoeuithis.ttf
          weight: 400
        - asset: assets/fonts/segoe-ui-this/segoeuithisi.ttf
          style: italic
          weight: 400
        - asset: assets/fonts/segoe-ui-this/segoeuithisz.ttf
          style: italic
          weight: 700